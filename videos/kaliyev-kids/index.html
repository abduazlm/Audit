<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaliyev School Reel</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>html, body { margin: 0; background: #07063a; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ------------------------------------------------------------------------------------------
// Kaliyev School — «Почему дети подхватывают английский на лету» (assets/vo.wav).
// Brand look from their posts: navy, logo yellow, white heavy caps (Montserrat), gold calligraphy
// (Great Vibes), small spaced caps labels, «KALIYEV SCHOOL» header. Flat illustrated characters
// (a kid, a tired adult, a brain network, a sponge, rocket, hourglass) drawn in code.
// Everything is a pure function of t: renderFrame(t).
// ------------------------------------------------------------------------------------------
const W = 1080, H = 1920, CX = W / 2;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; cv.style.width = W + 'px';
const ctx = cv.getContext('2d');
const NAVY = '#0a0848', NAVY2 = '#14126a', YEL = '#f9c410', GOLD = '#f2c94c', WHITE = '#ffffff', INK = '#0a0848';
const SKIN = '#f6c9a4', SKIN2 = '#e8ad85', HAIR = '#3b2416', PINK = 'rgba(255,120,120,.45)', RED = '#ff5a4e';
const CAPS = 'Montserrat, Arial Black, sans-serif', SCRIPT = '"Great Vibes", cursive';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const font = (w, s, f) => `${w} ${Math.round(s)}px ${f}`;
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const pop = (t, a, d = .35) => eBack(prog(t, a, a + d));            // 0 → overshoot → 1

// ---------- word cues: Whisper times on assets/vo.wav minus VO_CUT (the off-script lead-in is cut) ----------
const VO_CUT = 3.45;
const W_ = {
  pochemu: .55, vzroslye: 1.31, godami: 2.07, zubryat: 2.49, pravila: 2.95, deti: 3.67, angl: 4.45, letu: 5.11,
  vsyo: 6.03, neuro: 6.53,
  do: 7.91, n12: 8.13, mozg: 8.79, rebenka: 9.47, kak: 10.21, gubka: 10.43,
  vpityvaet: 11.65, yazyk: 12.11, estestv: 12.51, bez: 13.65, gramm: 14.21, yazykovogo: 14.99, barier: 15.49,
  deti2: 16.61, perevodyat: 17.03, golove: 17.81, boyatsya: 18.49, oshibok: 18.75,
  legko: 19.81, srazu: 20.53, chistoe: 21.47, proizn: 21.95,
  ispolz: 23.33, vozrast: 24.19, legkogo: 25.03, start: 25.37,
  nezhdite: 26.23, poka: 26.71, slozhnym: 27.61, predmetom: 27.99, shkole: 28.45,
  zapishite: 29.09, besplatny: 30.19, probny: 30.69, urok: 31.01, ssylke: 31.61, video: 32.13
};
const SC = [[0, 5.85], [5.85, 7.75], [7.75, 11.45], [11.45, 16.3], [16.3, 19.35], [19.35, 23.0], [23.0, 26.0], [26.0, 28.95], [28.95, 32.7], [32.7, 35.2]];
const DURATION = 35.2;

// ---------- text ----------
// kinds: caps (white heavy), gold (yellow heavy), script (gold calligraphy), label (small spaced caps)
function word(text, x, y, o, t, a, b = 1e9) {
  const kin = prog(t, a, a + .22), kout = prog(t, b - .15, b);
  if (kin <= 0 || kout >= 1) return;
  const { size, kind = 'caps', align = 'center', rot = 0 } = o;
  const k = eOut(kin);
  ctx.save(); ctx.translate(x, y + (1 - k) * 26); ctx.rotate(rot);
  ctx.globalAlpha = k * (1 - kout);
  if (kin < 1) ctx.filter = `blur(${(1 - k) * 8}px)`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (kind === 'script') { ctx.font = font(400, size, SCRIPT); ctx.fillStyle = GOLD; ctx.letterSpacing = '0px'; }
  else if (kind === 'label') { ctx.font = font(800, size, CAPS); ctx.fillStyle = GOLD; ctx.letterSpacing = `${size * .28}px`; }
  else { ctx.font = font(900, size, CAPS); ctx.fillStyle = kind === 'gold' ? YEL : (o.color || WHITE); ctx.letterSpacing = `${-size * .02}px`; }
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 4;
  ctx.fillText(text, 0, 0);
  if (o.strike) {                                                         // red strike-through that draws itself
    const w = ctx.measureText(text).width, s = eInOut(prog(t, o.strike, o.strike + .3));
    const x0 = align === 'center' ? -w / 2 : align === 'right' ? -w : 0;
    if (s > 0) { ctx.shadowBlur = 0; ctx.strokeStyle = RED; ctx.lineWidth = size * .12; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0 - 10, -size * .33); ctx.lineTo(x0 - 10 + (w + 20) * s, -size * .33); ctx.stroke(); }
  }
  ctx.restore();
}
function fit(text, max, maxW, kind = 'caps') {
  ctx.save(); ctx.font = kind === 'script' ? font(400, max, SCRIPT) : font(900, max, CAPS);
  ctx.letterSpacing = kind === 'script' ? '0px' : `${-max * .02}px`;
  const w = ctx.measureText(text).width; ctx.restore(); return w > maxW ? max * maxW / w : max;
}

// ---------- background & brand chrome ----------
function bg(t) {
  const g = ctx.createRadialGradient(CX, H * .45, 0, CX, H * .45, H * .75);
  g.addColorStop(0, '#16137a'); g.addColorStop(.55, NAVY); g.addColorStop(1, '#05042a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // drifting network dots, the logo's motif, very faint
  const P = [];
  for (let i = 0; i < 26; i++) P.push([(hash(i) * W + Math.sin(t * .3 + i) * 40 + W) % W, (hash(i + 50) * H + t * (8 + hash(i + 9) * 14)) % H]);
  ctx.strokeStyle = 'rgba(249,196,16,.07)'; ctx.lineWidth = 2;
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
    const d = Math.hypot(P[i][0] - P[j][0], P[i][1] - P[j][1]);
    if (d < 260) { ctx.beginPath(); ctx.moveTo(...P[i]); ctx.lineTo(...P[j]); ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(249,196,16,.16)';
  P.forEach(([x, y], i) => { ctx.beginPath(); ctx.arc(x, y, 3 + hash(i + 3) * 5, 0, 7); ctx.fill(); });
}
function chrome(t, n) {
  ctx.save(); ctx.globalAlpha = prog(t, .1, .5);
  ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = '1px';
  ctx.fillStyle = WHITE; ctx.font = font(800, 30, CAPS); ctx.textAlign = 'left'; ctx.fillText('KALIYEV SCHOOL', 70, 200);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = font(800, 22, CAPS); ctx.letterSpacing = '0px'; ctx.fillText('kaliyev_school', 70, 232);
  ctx.textAlign = 'right'; ctx.fillStyle = GOLD; ctx.font = font(800, 26, CAPS); ctx.letterSpacing = '3px';
  ctx.fillText(`${String(n).padStart(2, '0')} / ${String(SC.length).padStart(2, '0')}`, W - 70, 200);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = font(800, 20, CAPS); ctx.letterSpacing = '2px'; ctx.fillText('АНГЛИЙСКИЙ', W - 70, 232);
  ctx.restore();
}

// ---------- characters & props (origin = centre of the head / object, s = scale) ----------
const blink = (t, seed) => ((t * .9 + seed) % 3.1) < .13 ? .12 : 1;
function face(t, seed, o) {
  const b = blink(t, seed);
  ctx.fillStyle = '#1d1b2e';
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(sx * 40, 8); ctx.scale(1, b); ctx.beginPath(); ctx.ellipse(0, 0, 15, 19, 0, 0, 7); ctx.fill();
    if (b > .5) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-5, -7, 5.5, 0, 7); ctx.fill(); ctx.fillStyle = '#1d1b2e'; }
    ctx.restore();
  }
  ctx.fillStyle = PINK; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 70, 46, 18, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#3a1f1a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 40, -18, 16, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke(); }
  if (o.talk) {                                                           // open, moving mouth
    const m = .45 + .55 * Math.abs(Math.sin(t * 16 + seed));
    ctx.fillStyle = '#7a2030'; ctx.beginPath(); ctx.ellipse(0, 56, 24, 8 + 14 * m, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff8a8a'; ctx.beginPath(); ctx.ellipse(0, 62 + 6 * m, 13, 5 + 4 * m, 0, 0, 7); ctx.fill();
  } else { ctx.beginPath(); ctx.arc(0, 36, 30, .18 * Math.PI, .82 * Math.PI); ctx.stroke(); }
}
function arm(sx, ang, sleeve, len = 150) {                                // from the shoulder; ang = 0 hangs down
  ctx.save(); ctx.translate(sx * 88, 128); ctx.rotate(ang * sx);
  rr(-21, -10, 42, len * .45, 20); ctx.fillStyle = sleeve; ctx.fill();
  rr(-17, len * .35, 34, len * .6, 17); ctx.fillStyle = SKIN; ctx.fill();
  ctx.beginPath(); ctx.arc(0, len * .95, 24, 0, 7); ctx.fill();
  ctx.restore();
}
function kid(x, y, s, t, o = {}) {
  const { shirt = YEL, girl = false, wave = 0, talk = false, seed = 0, armL, armR } = o;
  const bob = Math.sin(t * 5 + seed) * 6;
  ctx.save(); ctx.translate(x, y + bob); ctx.scale(s, s);
  // legs, shorts, body
  ctx.fillStyle = SKIN; ctx.fillRect(-58, 330, 38, 80); ctx.fillRect(20, 330, 38, 80);
  ctx.fillStyle = '#1b1b2b'; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 42, 414, 34, 16, 0, 0, 7); ctx.fill(); }
  rr(-92, 270, 184, 90, 26); ctx.fillStyle = '#3f4fb8'; ctx.fill();
  const wv = Math.sin(t * 9 + seed) * .25;
  arm(-1, armL ?? .28, shirt); arm(1, armR ?? (.28 + wave * (2.5 + wv)), shirt);
  rr(-100, 92, 200, 210, 70); ctx.fillStyle = shirt; ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.08)'; rr(-100, 230, 200, 72, 30); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 95, 34, 0, Math.PI); ctx.fillStyle = SKIN2; ctx.fill();   // neck shadow
  // head
  ctx.fillStyle = SKIN; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 108, 12, 22, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.arc(0, 0, 110, 0, 7); ctx.fill();
  ctx.fillStyle = HAIR;
  if (girl) {
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 128, -12, 42, 0, 7); ctx.fill(); }
    ctx.fillStyle = YEL; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 104, -52, 16, 0, 7); ctx.fill(); }
    ctx.fillStyle = HAIR;
  }
  ctx.beginPath(); ctx.arc(0, -4, 116, Math.PI * 1.02, Math.PI * 1.98);
  ctx.quadraticCurveTo(70, -70, 30, -40); ctx.quadraticCurveTo(0, -78, -30, -42); ctx.quadraticCurveTo(-70, -70, -114, -14);
  ctx.closePath(); ctx.fill();
  face(t, seed, { talk });
  ctx.restore();
}
function adult(x, y, s, t, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rr(-135, 100, 270, 300, 70); ctx.fillStyle = '#dfe6f5'; ctx.fill();
  ctx.fillStyle = YEL; ctx.beginPath(); ctx.moveTo(-16, 108); ctx.lineTo(16, 108); ctx.lineTo(24, 250); ctx.lineTo(0, 280); ctx.lineTo(-24, 250); ctx.closePath(); ctx.fill();
  // head
  ctx.fillStyle = SKIN; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 112, 14, 22, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(0, 0, 112, 122, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#2b2b33'; ctx.beginPath(); ctx.arc(0, -10, 116, Math.PI * 1.08, Math.PI * 1.92); ctx.quadraticCurveTo(0, -95, -106, -48); ctx.fill();
  // tired face: glasses, slanted brows, wavy mouth, eye bags
  ctx.strokeStyle = '#1d1b2e'; ctx.lineWidth = 7;
  for (const sx of [-1, 1]) { rr(sx * 44 - 32, -10, 64, 46, 14); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-12, 8); ctx.lineTo(12, 8); ctx.stroke();
  const b = blink(t, 1.3);
  ctx.fillStyle = '#1d1b2e'; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 44, 14, 9, 10 * b, 0, 0, 7); ctx.fill(); }
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 70, -38); ctx.lineTo(sx * 22, -26); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-30, 70); ctx.quadraticCurveTo(-15, 60, 0, 70); ctx.quadraticCurveTo(15, 80, 30, 70); ctx.stroke();
  // sweat drops sliding down
  for (let i = 0; i < 2; i++) {
    const p = ((t * .8 + i * .5) % 1), sx = i ? 1 : -1;
    ctx.save(); ctx.globalAlpha = 1 - p; ctx.translate(sx * 98, -40 + p * 80);
    ctx.fillStyle = '#7fd0ff'; ctx.beginPath(); ctx.moveTo(0, -18); ctx.quadraticCurveTo(14, 4, 0, 12); ctx.quadraticCurveTo(-14, 4, 0, -18); ctx.fill(); ctx.restore();
  }
  // hands holding a «RULES» book
  ctx.save(); ctx.translate(0, 230 + Math.sin(t * 3) * 4); ctx.rotate(-.04);
  rr(-140, -70, 280, 150, 14); ctx.fillStyle = '#c0392b'; ctx.fill();
  rr(-140, -70, 26, 150, 8); ctx.fillStyle = '#962d22'; ctx.fill();
  ctx.fillStyle = WHITE; ctx.font = font(900, 48, CAPS); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('RULES', 12, 6);
  ctx.fillStyle = SKIN; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 140, 10, 28, 0, 7); ctx.fill(); }
  ctx.restore();
  ctx.restore();
}
function bookStack(x, y, s, t, titles) {
  const cols = ['#ffffff', YEL, '#7fa8ff', '#ff8a6b', '#b8f0c8'];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  titles.forEach((title, i) => {
    const k = pop(t, titles.at ? 0 : 0, .1);
    ctx.save(); ctx.translate(Math.sin(i * 2.1) * 18, -i * 62); ctx.rotate(Math.sin(i * 1.7) * .05);
    rr(-170, -28, 340, 58, 10); ctx.fillStyle = cols[i % cols.length]; ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(-170, 14, 340, 16);
    ctx.fillStyle = INK; ctx.font = font(900, 30, CAPS); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '4px'; ctx.fillText(title, 0, -4);
    ctx.restore();
  });
  ctx.restore();
}
function tile(x, y, ch, s, rot, alpha = 1) {                              // letter card
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
  rr(-50, -50, 100, 100, 20); ctx.fillStyle = WHITE; ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.fillStyle = INK; ctx.font = font(900, 62, CAPS); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, 0, 4);
  ctx.restore();
}
function bubble(x, y, w, h, text, o = {}) {                               // speech (tail down-left) or thought bubble
  const { size = 56, thought = false, fill = WHITE, color = INK, tail = -1 } = o;
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6; ctx.fillStyle = fill;
  rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  if (thought) { [[tail * w * .3, h / 2 + 30, 20], [tail * w * .36, h / 2 + 70, 12]].forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(a, b, r, 0, 7); ctx.fill(); }); }
  else { ctx.beginPath(); ctx.moveTo(tail * w * .18, h / 2 - 4); ctx.lineTo(tail * w * .32, h / 2 + 52); ctx.lineTo(tail * w * .02, h / 2 - 4); ctx.fill(); }
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.fillStyle = color; ctx.font = font(900, size, CAPS); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 4);
  ctx.restore();
}
const NODES = [[-150, -20, 16], [-95, -95, 12], [-10, -125, 14], [95, -105, 18], [150, -25, 12], [0, -30, 32], [-80, 30, 22], [40, 40, 14], [115, 60, 22], [-25, 120, 20], [-140, 80, 10], [150, 120, 10]];
const EDGES = [[0, 1], [1, 2], [2, 3], [3, 4], [1, 5], [2, 5], [3, 5], [5, 6], [5, 7], [7, 8], [4, 8], [6, 9], [7, 9], [0, 6], [6, 10], [8, 11], [9, 8], [0, 10]];
function network(x, y, s, t, a, glow = 0) {                               // the logo's node graph, building up from time a
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (glow > 0) { const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 320); g.addColorStop(0, `rgba(249,196,16,${.35 * glow})`); g.addColorStop(1, 'rgba(249,196,16,0)'); ctx.fillStyle = g; ctx.fillRect(-320, -320, 640, 640); }
  ctx.strokeStyle = YEL; ctx.lineWidth = 5; ctx.lineCap = 'round';
  EDGES.forEach(([i, j], n) => {
    const k = eInOut(prog(t, a + .15 + n * .04, a + .45 + n * .04)); if (k <= 0) return;
    const [x1, y1] = NODES[i], [x2, y2] = NODES[j];
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, k), lerp(y1, y2, k)); ctx.stroke();
  });
  NODES.forEach(([nx, ny, r], n) => {
    const k = pop(t, a + n * .05, .3); if (k <= 0) return;
    const pulse = 1 + .12 * Math.sin(t * 6 + n) * glow;
    ctx.fillStyle = YEL; ctx.beginPath(); ctx.arc(nx, ny, r * k * pulse, 0, 7); ctx.fill();
  });
  ctx.restore();
}
function sponge(x, y, s, t, o = {}) {                                     // brain-sponge with a face
  const { squish = 0, talk = false } = o;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (1 + squish * .08), s * (1 - squish * .08));
  ctx.shadowColor = 'rgba(249,196,16,.5)'; ctx.shadowBlur = 50;
  rr(-190, -160, 380, 320, 70); ctx.fillStyle = YEL; ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#d9a400';
  [[-120, -100, 26], [110, -110, 18], [140, 40, 24], [-140, 70, 16], [-60, 110, 14], [80, 110, 20], [10, -130, 12], [-150, -20, 12]]
    .forEach(([a, b, r]) => { ctx.beginPath(); ctx.ellipse(a, b, r, r * .8, 0, 0, 7); ctx.fill(); });
  ctx.strokeStyle = 'rgba(160,110,0,.5)'; ctx.lineWidth = 6;               // brain folds
  ctx.beginPath(); ctx.moveTo(0, -160); ctx.bezierCurveTo(-30, -120, 30, -100, 0, -70); ctx.stroke();
  ctx.translate(0, 10); ctx.scale(.9, .9); face(t, 2.2, { talk });
  ctx.restore();
}
function cross(x, y, s, k) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(s * k, s * k);
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fillStyle = RED; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-13, -13); ctx.lineTo(13, 13); ctx.moveTo(13, -13); ctx.lineTo(-13, 13); ctx.stroke(); ctx.restore(); }
function check(x, y, s, k) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(s * k, s * k);
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fillStyle = '#27c46b'; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-14, 1); ctx.lineTo(-4, 12); ctx.lineTo(15, -11); ctx.stroke(); ctx.restore(); }
function rocket(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(Math.sin(t * 7) * .03);
  const fl = 60 + 25 * Math.abs(Math.sin(t * 23));                         // flame
  ctx.fillStyle = '#ff7a2f'; ctx.beginPath(); ctx.moveTo(-34, 120); ctx.quadraticCurveTo(0, 120 + fl * 1.6, 34, 120); ctx.fill();
  ctx.fillStyle = YEL; ctx.beginPath(); ctx.moveTo(-20, 120); ctx.quadraticCurveTo(0, 120 + fl, 20, 120); ctx.fill();
  ctx.fillStyle = YEL; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 50, 40); ctx.lineTo(sx * 95, 125); ctx.lineTo(sx * 45, 110); ctx.fill(); }
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.moveTo(0, -170); ctx.bezierCurveTo(90, -90, 70, 60, 50, 125); ctx.lineTo(-50, 125); ctx.bezierCurveTo(-70, 60, -90, -90, 0, -170); ctx.fill();
  ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(0, -170); ctx.bezierCurveTo(40, -135, 55, -110, 60, -90); ctx.lineTo(-60, -90); ctx.bezierCurveTo(-55, -110, -40, -135, 0, -170); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -20, 36, 0, 7); ctx.fillStyle = YEL; ctx.fill(); ctx.beginPath(); ctx.arc(0, -20, 26, 0, 7); ctx.fillStyle = '#2a2890'; ctx.fill();
  ctx.restore();
}
function hourglass(x, y, s, t, a) {

  ctx.fillStyle = YEL;

  ctx.beginPath(); ctx.moveTo(-70 * top, -10 - 110 * top); ctx.lineTo(70 * top, -10 - 110 * top); ctx.lineTo(0, -6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-80, 135); ctx.lineTo(80, 135); ctx.lineTo(0, 135 - 110 * sand); ctx.fill();

function soundWave(x, y, w, t, amp) {

function renderFrame(t) {
