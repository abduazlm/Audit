<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background-color: #0d3a2c;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          opacity: 0;
        }
        .center-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 90px;
        }
        .lead-line {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 66px;
          font-weight: 700;
          color: #f4f1e9;
          text-align: center;
          opacity: 0;
        }
        .lead-line span {
          max-width: 820px;
        }
        .kicker-block {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          opacity: 0;
        }
        .clock-icon {
          width: 224px;
          height: 224px;
          color: #f4f1e9;
          margin-bottom: 24px;
          transform-box: fill-box;
          overflow: visible;
        }
        .guarantee-kicker {
          font-size: 48px;
          font-weight: 700;
          color: #f4f1e9;
        }
        .hours-block {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
        .moneybag-icon {
          width: 272px;
          height: 272px;
          margin-bottom: 28px;
          transform-origin: 50% 50%;
          overflow: visible;
        }
        .moneybag-body {
          fill: #a37e2d;
        }
        .moneybag-tie {
          fill: #c99a3a;
        }
        .moneybag-sign {
          fill: #0d3a2c;
          font-size: 38px;
          font-weight: 800;
          text-anchor: middle;
          dominant-baseline: middle;
        }
        .guarantee-hours {
          font-size: 168px;
          font-weight: 800;
          line-height: 1;
          color: #f4f1e9;
          transform-origin: 50% 50%;
        }
        .settle-line {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 88px;
          font-weight: 800;
          line-height: 1.08;
          color: #f4f1e9;
          text-align: center;
          opacity: 0;
        }
        .settle-line span {
          max-width: 880px;
        }
      </style>

      <div
        id="root"
        data-composition-id="guarantee"
        data-width="1080"
        data-height="1920"
        data-duration="6.8"
      >
        <div class="center-wrap">
          <div class="lead-line" id="g-lead"><span>И самое главное…</span></div>
          <div class="kicker-block" id="g-kicker-block">
            <svg class="clock-icon" id="g-clock" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
              <circle cx="40" cy="40" r="32" />
              <line x1="40" y1="40" x2="40" y2="22" />
              <line class="clock-hand" id="g-clock-hand" x1="40" y1="40" x2="58" y2="40" />
              <circle cx="40" cy="40" r="3.5" fill="currentColor" stroke="none" />
            </svg>
            <div class="guarantee-kicker">Не смонтируем за</div>
          </div>
          <div class="hours-block" id="g-hours-block">
            <div class="guarantee-hours">24 часа</div>
          </div>
          <div class="settle-line" id="g-settle">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <svg class="moneybag-icon" id="g-moneybag" viewBox="0 0 100 110" fill="none">
                <path class="moneybag-body" d="M35 25 C15 25 8 55 12 75 C16 95 35 102 50 102 C65 102 84 95 88 75 C92 55 85 25 65 25 Z" />
                <rect class="moneybag-tie" x="36" y="6" width="28" height="20" rx="9" />
                <text class="moneybag-sign" x="50" y="72">₸</text>
              </svg>
              <span>вы можете не платить</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Root dissolve-in from Benefits.
        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);

        // Beat 1 — "И самое главное —" (real VO: 7.044-8.064s), held through the
        // real pause, then cleared.
        tl.fromTo("#g-lead", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.09);
        tl.to("#g-lead", { opacity: 0, duration: 0.2, ease: "power1.in" }, 1.11);

        // Beat 2 — the clock + "Не смонтируем за" kicker holds through the real
        // VO buildup ("если мы не сделаем монтаж за", 8.264-10.5s) — no dead air
        // while that clause is spoken.
        tl.fromTo("#g-kicker-block", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.31);

        // Clock hand ticks forward in discrete steps across the buildup —
        // deterministic finite jumps, not a spinning loop.
        tl.to("#g-clock-hand", { rotation: 15, svgOrigin: "40 40", duration: 0.1, ease: "power1.out" }, 1.7);
        tl.to("#g-clock-hand", { rotation: 30, svgOrigin: "40 40", duration: 0.1, ease: "power1.out" }, 2.04);
        tl.to("#g-clock-hand", { rotation: 45, svgOrigin: "40 40", duration: 0.1, ease: "power1.out" }, 2.38);
        tl.to("#g-clock-hand", { rotation: 60, svgOrigin: "40 40", duration: 0.1, ease: "power1.out" }, 2.72);
        tl.to("#g-clock-hand", { rotation: 75, svgOrigin: "40 40", duration: 0.1, ease: "power1.out" }, 3.06);
        tl.to("#g-clock-hand", { rotation: 90, svgOrigin: "40 40", duration: 0.1, ease: "power1.out" }, 3.4);

        tl.to("#g-kicker-block", { opacity: 0, duration: 0.15, ease: "power1.in" }, 3.4);

        // The ONE carmine urgency beat — background flash + spring-pop text land
        // exactly on the real VO's "24 часа" (10.5-11.244s = local 3.546-4.29s).
        tl.to(
          "#root",
          { backgroundColor: "#a20404", duration: 0.15, ease: "power2.out" },
          3.546,
        );
        tl.fromTo(
          "#g-hours-block",
          { opacity: 0 },
          { opacity: 1, duration: 0.15, ease: "power2.out" },
          3.596,
        );
        tl.fromTo(
          "#g-hours-block .guarantee-hours",
          { scale: 0.6 },
          { scale: 1, duration: 0.35, ease: "power3.out" },
          3.596,
        );

        // Hold the flash through the spoken word, then dissolve back to green —
        // the real VO's pause before "вы можете не платить" (11.244-11.388s).
        tl.to(
          "#root",
          { backgroundColor: "#0d3a2c", duration: 0.3, ease: "power1.inOut" },
          4.29,
        );
        tl.to("#g-hours-block", { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.29);

        // The settle line — lands exactly on the real VO's "вы можете не платить"
        // (11.388-12.591s = local 4.434-5.637s).
        tl.fromTo(
          "#g-settle",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          4.434,
        );

        // The money bag spring-pops in with the settle line — the risk-reversal beat.
        tl.fromTo(
          "#g-moneybag",
          { scale: 0 },
          { scale: 1, duration: 0.35, ease: "power3.out" },
          4.5,
        );

        // Hold past the end of speech, then soft dissolve out before the cut to
        // the Brand Outro.
        tl.to("#root", { opacity: 0, duration: 0.35, ease: "power1.in" }, 6.45);

        window.__timelines["guarantee"] = tl;
      </script>
    </template>
  </body>
</html>
