<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #0d3a2c;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
        }
        .fade-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 0 90px;
        }
        .checker {
          position: absolute;
          top: 64px;
          right: 64px;
          width: 216px;
          height: 216px;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          grid-template-rows: repeat(3, 1fr);
          opacity: 0;
        }
        .checker div:nth-child(odd) {
          background: #a37e2d;
        }
        .checker div:nth-child(even) {
          background: #104434;
        }
        .kicker {
          position: absolute;
          top: 84px;
          left: 72px;
          font-size: 30px;
          font-weight: 600;
          letter-spacing: 0.14em;
          color: #f4f1e9;
          opacity: 0;
        }
        .numeral {
          font-size: 460px;
          font-weight: 800;
          line-height: 0.85;
          color: #c99a3a;
          text-align: center;
          transform-origin: 50% 50%;
        }
        .line1 {
          font-size: 92px;
          font-weight: 800;
          line-height: 1.05;
          color: #f4f1e9;
          text-align: center;
          max-width: 920px;
          margin-top: 8px;
        }
        .line2-row {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          max-width: 860px;
          margin-top: 36px;
          opacity: 0;
        }
        .camera-icon {
          flex: 0 0 auto;
          width: 208px;
          height: 146px;
          color: #c99a3a;
          transform-origin: 50% 50%;
          overflow: visible;
        }
        .rec-dot {
          fill: #e11414;
        }
        .line2 {
          font-size: 54px;
          font-weight: 700;
          line-height: 1.15;
          color: #f4f1e9;
          text-align: center;
          opacity: 0.9;
        }
      </style>

      <div
        id="root"
        data-composition-id="hook"
        data-width="1080"
        data-height="1920"
        data-duration="3.494"
      >
        <div class="checker" id="hook-checker">
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
        </div>
        <div class="kicker" id="hook-kicker">SEE GROUP</div>
        <div class="fade-wrap">
          <div class="numeral" id="hook-numeral">10</div>
          <div class="line1" id="hook-line1">продающих роликов</div>
          <div class="line2-row" id="hook-line2-row">
            <svg class="camera-icon" id="hook-camera" viewBox="0 0 100 70" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="14" width="58" height="42" rx="7" />
              <path d="M66 27 L92 13 V57 L66 43 Z" />
              <circle cx="34" cy="35" r="11" />
              <circle class="rec-dot" id="hook-rec-dot" cx="20" cy="23" r="4" stroke="none" />
            </svg>
            <div class="line2" id="hook-line2">на проф оборудование</div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Decorative checker corner + kicker settle in first.
        tl.fromTo("#hook-checker", { opacity: 0 }, { opacity: 0.12, duration: 0.45, ease: "power2.out" }, 0);
        tl.fromTo("#hook-kicker", { opacity: 0 }, { opacity: 0.72, duration: 0.4, ease: "power2.out" }, 0.05);

        // Spring-pop entrance on the hero numeral (spring-pop-entrance rule).
        tl.fromTo(
          "#hook-numeral",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.05,
        );

        // Line 1 / line 2 settle in below (fade + small rise).
        tl.fromTo(
          "#hook-line1",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          0.45,
        );
        tl.fromTo(
          "#hook-line2-row",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          0.7,
        );

        // Camera icon spring-pops in alongside the "проф оборудование" line.
        tl.fromTo(
          "#hook-camera",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
          0.78,
        );

        // REC dot — deterministic blink states (finite, no CSS loop).
        tl.set("#hook-rec-dot", { opacity: 1 }, 1.1);
        tl.set("#hook-rec-dot", { opacity: 0.25 }, 1.22);
        tl.set("#hook-rec-dot", { opacity: 1 }, 1.34);
        tl.set("#hook-rec-dot", { opacity: 0.25 }, 1.46);
        tl.set("#hook-rec-dot", { opacity: 1 }, 1.58);

        // Hold, then soft dissolve out before the cut to Frame 2.
        tl.to("#root", { opacity: 0, duration: 0.35, ease: "power1.in" }, 3.144);

        window.__timelines["hook"] = tl;
      </script>
    </template>
  </body>
</html>
