<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d3a2c;
      }
      body {
        font-family: "Montserrat", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15.754"
      data-width="1080"
      data-height="1920"
    >
      <!-- SEE Group — продающий motion-graphics ролик, синхронизирован с реальной
           озвучкой (silencedetect-границы фраз, см. STORYBOARD.md). -->
      <div
        id="el-hook"
        data-composition-id="hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3.494"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-benefits"
        data-composition-id="benefits"
        data-composition-src="compositions/frames/02-benefits.html"
        data-start="3.494"
        data-duration="3.46"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-guarantee"
        data-composition-id="guarantee"
        data-composition-src="compositions/frames/03-guarantee.html"
        data-start="6.954"
        data-duration="6.8"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-outro"
        data-composition-id="outro"
        data-composition-src="compositions/frames/04-outro.html"
        data-start="13.754"
        data-duration="2.0"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Voiceover — real recording, drives all the timings above. -->
      <audio
        id="voiceover"
        src="assets/audio/voiceover.mp3"
        data-start="0"
        data-duration="12.591"
        data-track-index="5"
        data-volume="1.0"
      ></audio>

      <!-- SFX — bundled media-use library, offline. -->

      <!-- Hook: numeral pop, camera "shutter" click -->
      <audio id="sfx-hook-pop" src="assets/sfx/pop.mp3" data-start="0.05" data-duration="0.72" data-track-index="10" data-volume="0.8"></audio>
      <audio id="sfx-hook-click" src="assets/sfx/click.mp3" data-start="1.0" data-duration="0.37" data-track-index="10" data-volume="0.7"></audio>

      <!-- Benefits: badge pops, pen "writing", model figures popping in -->
      <audio id="sfx-benefits-badge1" src="assets/sfx/pop.mp3" data-start="3.694" data-duration="0.72" data-track-index="10" data-volume="0.75"></audio>
      <audio id="sfx-benefits-typing" src="assets/sfx/typing.mp3" data-start="3.994" data-duration="0.6" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-benefits-badge2" src="assets/sfx/pop.mp3" data-start="5.294" data-duration="0.72" data-track-index="10" data-volume="0.75"></audio>
      <audio id="sfx-benefits-person1" src="assets/sfx/click-soft.mp3" data-start="5.364" data-duration="0.37" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-benefits-person2" src="assets/sfx/click-soft.mp3" data-start="5.464" data-duration="0.37" data-track-index="12" data-volume="0.6"></audio>

      <!-- Guarantee: clock ticks through the VO buildup, bass hit exactly on
           "24 часа", chime on the "вы можете не платить" payoff -->
      <audio id="sfx-guarantee-tick1" src="assets/sfx/click-soft.mp3" data-start="8.654" data-duration="0.3" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-guarantee-tick2" src="assets/sfx/click-soft.mp3" data-start="8.994" data-duration="0.3" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-guarantee-tick3" src="assets/sfx/click-soft.mp3" data-start="9.334" data-duration="0.3" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-guarantee-tick4" src="assets/sfx/click-soft.mp3" data-start="9.674" data-duration="0.3" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-guarantee-tick5" src="assets/sfx/click-soft.mp3" data-start="10.014" data-duration="0.3" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-guarantee-tick6" src="assets/sfx/click-soft.mp3" data-start="10.354" data-duration="0.3" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-guarantee-impact" src="assets/sfx/impact-bass-1.mp3" data-start="10.5" data-duration="2.12" data-track-index="11" data-volume="0.9"></audio>
      <audio id="sfx-guarantee-chime" src="assets/sfx/chime.mp3" data-start="11.454" data-duration="2.5" data-track-index="10" data-volume="0.75"></audio>

      <!-- Brand Outro: sparkle sting on the logo lockup -->
      <audio id="sfx-outro-sparkle" src="assets/sfx/sparkle.mp3" data-start="14.054" data-duration="1.7" data-track-index="10" data-volume="0.7"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Root timeline stays thin — all animation lives in the sub-compositions.
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
