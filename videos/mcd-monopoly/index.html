<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monopoly Case Reel</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>html, body { margin: 0; background: #0c0e14; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ------------------------------------------------------------------------------------------
// «Маркетинговые кейсы», ролик 1: McDonald's Monopoly — что пошло не так (assets/vo.wav, ElevenLabs «Artspace»).
// Series style: flat vector on a dark background, yellow = key words, red = threat/error,
// one phrase of ≤4 words per scene, label plates, numbers always on screen, nothing ever freezes.
// No brand logos are drawn: plain red/yellow cups and boxes. Deterministic: renderFrame(t).
// ------------------------------------------------------------------------------------------
const W = 1080, H = 1920, CX = W / 2;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; cv.style.width = W + 'px';
const ctx = cv.getContext('2d');
const BG = '#0c0e14', BG2 = '#161a24', YEL = '#ffcc1a', RED = '#ff3b30', WHITE = '#ffffff', GREY = '#8a90a0', GREEN = '#2ecc71';
const F = 'Montserrat, Arial Black, sans-serif';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a, d = .35) => eBack(prog(t, a, a + d));
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const font = (w, s) => `${w} ${Math.round(s)}px ${F}`;
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- timing: scene starts = VO clip starts (each scene's voice ends before the next) ----------
const VO = [0.5, 6.01, 18.07, 24.95, 35.79, 43.33, 51.19, 61.39, 71.11, 77.79, 85.15];
const DURATION = 90.4;
const SC = VO.map((s, i) => [i ? s - .3 : 0, i < VO.length - 1 ? VO[i + 1] - .3 : DURATION]);
// key words (Whisper word starts on assets/vo.wav)
const K = {
  ni: 2.31, million: 3.17, ponyatno: 4.11,
  y80: 6.29, igru: 8.29, monopoly: 9.07, kupil: 10.03, nakleil: 11.09, sobral: 12.25, vyigral: 13.77, prizy: 14.31, kartoshka: 15.59, million2: 16.61,
  ocheredi: 18.07, prodazhi: 19.89, akciya: 21.05, povtoryali: 23.11,
  chelovek: 25.39, nikto: 26.17, policeiskiy: 27.87, dzherom: 28.53, rukovodil: 30.33, pechatala: 32.91, bilety: 34.75,
  zadacha: 36.03, ohranyat: 37.47, tolko: 39.97, partii: 41.27, lezhat: 41.79,
  sistema: 43.33, idealno: 44.81, poka: 45.79, ponyal: 48.55, nekomu: 50.11,
  vynimat: 51.73, sam: 53.75, opasno: 55.89, posrednikov: 57.51, druzey: 58.61, rodstv: 59.33, znakomyh: 60.33,
  poluchal: 61.93, shel: 63.13, obyavlyal: 64.29, zabiral: 65.83, chast: 67.09, vozvrashal: 67.39, dalshe: 69.37,
  shema: 71.11, n12: 71.91, n24: 73.51, krupnye: 76.33,
  gody: 78.27, verili: 79.31, kazhdy: 80.87, pobediteli: 82.07, temi: 83.79,
  ruhnulo: 85.41, melochi: 86.73, produmal: 88.35
};

// ---------- text ----------
function title(lines, t, a, b, y = 330) {                                // big scene phrase, ≤4 words, yellow for key words
  const k = eOut(prog(t, a, a + .35)), ko = prog(t, b - .2, b);
  if (k <= 0 || ko >= 1) return;
  ctx.save(); ctx.globalAlpha = k * (1 - ko); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  lines.forEach(([text, col, size = 96], i) => {
    const d = eOut(prog(t, a + i * .12, a + i * .12 + .4));
    let s = size; ctx.font = font(900, s); ctx.letterSpacing = `${-s * .02}px`;
    const w = ctx.measureText(text).width; if (w > W * .88) { s *= W * .88 / w; ctx.font = font(900, s); }
    ctx.fillStyle = col || WHITE; ctx.globalAlpha = k * (1 - ko) * d;
    ctx.fillText(text, CX, y + i * s * 1.08 + (1 - d) * 30);
    y += 0;
  });
  ctx.restore();
}
function plate(text, x, y, t, a, b = 1e9, o = {}) {                       // label plate: «схема», «12 лет», «$24 млн»
  const k = pop(t, a, .4), ko = prog(t, b - .2, b);
  if (k <= 0 || ko >= 1) return;
  const { col = YEL, ink = BG, size = 44, rot = 0 } = o;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k); ctx.globalAlpha = 1 - ko;
  ctx.font = font(900, size); ctx.letterSpacing = '1px';
  const w = ctx.measureText(text).width + size * 1.1, h = size * 1.7;
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 20; rr(-w / 2, -h / 2, w, h, 14); ctx.fillStyle = col; ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, size * .06);
  ctx.restore();
}

// ---------- background: dark, slow drifting grid + vignette, so no frame is ever still ----------
function bg(t) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 2;
  const s = 90, off = (t * 10) % s;
  for (let x = -s; x < W + s; x += s) { ctx.beginPath(); ctx.moveTo(x + off, 0); ctx.lineTo(x + off, H); ctx.stroke(); }
  for (let y = -s; y < H + s; y += s) { ctx.beginPath(); ctx.moveTo(0, y + off * .6); ctx.lineTo(W, y + off * .6); ctx.stroke(); }
  for (let i = 0; i < 30; i++) {                                         // dust
    const x = (hash(i) * W + t * (6 + hash(i + 3) * 10)) % W, y = (hash(i + 7) * H - t * (10 + hash(i + 5) * 20) % H + H) % H;
    ctx.fillStyle = `rgba(255,204,26,${.05 + .08 * hash(i + 2)})`; ctx.beginPath(); ctx.arc(x, y, 2 + 3 * hash(i + 4), 0, 7); ctx.fill();
  }
  const g = ctx.createRadialGradient(CX, H * .5, H * .25, CX, H * .5, H * .8);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function chrome(t, n) {
  ctx.save(); ctx.globalAlpha = prog(t, .2, .6);
  ctx.textBaseline = 'alphabetic'; ctx.font = font(800, 26); ctx.letterSpacing = '4px';
  ctx.fillStyle = GREY; ctx.textAlign = 'left'; ctx.fillText('МАРКЕТИНГОВЫЕ КЕЙСЫ', 70, 190);
  ctx.textAlign = 'right'; ctx.fillStyle = YEL; ctx.fillText(`${String(n).padStart(2, '0')} / ${SC.length}`, W - 70, 190);
  const p = t / DURATION;                                                // thin progress line
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(70, 212, W - 140, 4); ctx.fillStyle = YEL; ctx.fillRect(70, 212, (W - 140) * p, 4);
  ctx.restore();
}

// ---------- props ----------
function cup(x, y, s, o = {}) {                                          // soda cup with a game sticker
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(o.rot || 0);
  ctx.fillStyle = '#e8e8e8'; rr(-70, -150, 140, 22, 10); ctx.fill();
  ctx.fillStyle = WHITE; ctx.fillRect(-12, -200, 14, 60);                // straw
  ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(-64, -130); ctx.lineTo(64, -130); ctx.lineTo(48, 120); ctx.lineTo(-48, 120); ctx.closePath(); ctx.fill();
  ctx.fillStyle = YEL; ctx.beginPath(); ctx.moveTo(-60, -60); ctx.lineTo(60, -60); ctx.lineTo(57, -36); ctx.lineTo(-57, -36); ctx.closePath(); ctx.fill();
  if (o.sticker !== false) sticker(0, 30, .55, o.peel || 0, o.win);
  ctx.restore();
}
function fries(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = YEL; for (let i = 0; i < 7; i++) { ctx.save(); ctx.translate(-48 + i * 16, -40); ctx.rotate((i - 3) * .06); ctx.fillRect(-7, -90, 14, 100); ctx.restore(); }
  ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(-70, -50); ctx.quadraticCurveTo(0, -20, 70, -50); ctx.lineTo(55, 90); ctx.lineTo(-55, 90); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function sticker(x, y, s, peel = 0, win = false) {                         // game piece sticker (peel = 0..1 lifts a corner)
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rr(-80, -60, 160, 120, 14); ctx.fillStyle = WHITE; ctx.fill();
  ctx.fillStyle = win ? YEL : '#2f6fdf'; ctx.fillRect(-80, -60, 160, 34);
  ctx.fillStyle = BG; ctx.font = font(900, 26); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(win ? '$1 000 000' : 'BOARDWALK', 0, 16);
  if (peel > 0) { ctx.fillStyle = '#d8d8d8'; ctx.beginPath(); ctx.moveTo(80, 60); ctx.lineTo(80 - 70 * peel, 60); ctx.lineTo(80, 60 - 60 * peel); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function person(x, y, s, o = {}) {                                        // flat silhouette; o.col body colour, o.badge, o.hat
  const { col = '#3a4152', head = '#4a5266', badge = false, bob = 0, hold } = o;
  ctx.save(); ctx.translate(x, y + bob); ctx.scale(s, s);
  rr(-70, 40, 140, 200, 60); ctx.fillStyle = col; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -20, 58, 0, 7); ctx.fillStyle = head; ctx.fill();
  if (badge) { ctx.fillStyle = YEL; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 12 : 26; ctx.lineTo(-30 + Math.cos(a) * r, 100 + Math.sin(a) * r); } ctx.closePath(); ctx.fill(); }
  if (hold === 'ticket') { ctx.save(); ctx.translate(70, 120); ctx.rotate(-.2); rr(-40, -26, 80, 52, 6); ctx.fillStyle = WHITE; ctx.fill(); ctx.fillStyle = YEL; ctx.fillRect(-40, -26, 80, 16); ctx.restore(); }
  if (hold === 'check') { ctx.save(); ctx.translate(70, 110); ctx.rotate(-.15); rr(-70, -30, 140, 60, 6); ctx.fillStyle = GREEN; ctx.fill(); ctx.fillStyle = WHITE; ctx.font = font(900, 26); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$$$', 0, 2); ctx.restore(); }
  if (hold === 'env') { ctx.save(); ctx.translate(70, 120); rr(-44, -30, 88, 60, 6); ctx.fillStyle = '#e9d9b0'; ctx.fill(); ctx.strokeStyle = '#b89c5a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-44, -30); ctx.lineTo(0, 4); ctx.lineTo(44, -30); ctx.stroke(); ctx.restore(); }
  ctx.restore();
}
function arrow(x1, y1, x2, y2, k, col = YEL, w = 8) {
  if (k <= 0) return;
  const x = lerp(x1, x2, k), y = lerp(y1, y2, k), a = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 18, y + Math.sin(a) * 18); ctx.lineTo(x + Math.cos(a + 2.4) * 22, y + Math.sin(a + 2.4) * 22); ctx.lineTo(x + Math.cos(a - 2.4) * 22, y + Math.sin(a - 2.4) * 22); ctx.fill();
}
function qmark(x, y, s, t, a) {
  const k = pop(t, a, .45); if (k <= 0) return;
  ctx.save(); ctx.translate(x, y + Math.sin(t * 4) * 8); ctx.scale(k * s, k * s);
  ctx.shadowColor = 'rgba(255,59,48,.6)'; ctx.shadowBlur = 30; ctx.fillStyle = RED; ctx.font = font(900, 160); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 0, 0); ctx.restore();
}
function money(n) { return '$' + Math.round(n).toLocaleString('ru-RU').replace(/ /g, ' '); }

// ---------- scenes ----------
function s1(t) {                                                          // hook: cups & fries with stickers, «0 побед»
  const [a, b] = SC[0];
  const items = [[200, 'cup'], [430, 'fries'], [650, 'cup'], [880, 'fries']];
  items.forEach(([x, k], i) => {
    const kk = pop(t, a + .1 + i * .15, .4), y = 1180 + Math.sin(t * 2 + i) * 10;
    if (kk <= 0) return;
    if (k === 'cup') cup(x, y, 1.1 * kk, { peel: Math.abs(Math.sin(t * 1.5 + i)) * .6, rot: Math.sin(t + i) * .04 });
    else { fries(x, y + 40, 1.1 * kk); sticker(x, y + 100, .5 * kk, Math.abs(Math.sin(t * 1.7 + i)) * .6); }
  });
  // stickers falling with a red «✕ не выиграл»
  for (let i = 0; i < 6; i++) { const p = ((t * .35 + i / 6) % 1); ctx.save(); ctx.globalAlpha = Math.sin(Math.PI * p) * .8;
    ctx.translate(120 + i * 170, 700 + p * 300); ctx.rotate(p * 3 + i); sticker(0, 0, .35); ctx.restore(); }
  plate('0 ПОБЕД', CX, 1500, t, K.ni, b, { col: RED, ink: WHITE, size: 64, rot: -.04 });
  title([['ТЫ НИКОГДА', WHITE, 110], ['НЕ ВЫИГРЫВАЛ?', YEL, 110]], t, a, b, 420);
  if (t > K.million) { const k = pop(t, K.million, .4); ctx.save(); ctx.globalAlpha = clamp(k); ctx.font = font(900, 70); ctx.textAlign = 'center'; ctx.fillStyle = GREY;
    ctx.fillText('$1 000 000', CX, 760); ctx.strokeStyle = RED; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(CX - 220, 735); ctx.lineTo(CX - 220 + 440 * eInOut(prog(t, K.million + .2, K.million + .6)), 735); ctx.stroke(); ctx.restore(); }
}
function board(cx, cy, size, t, k) {                                      // Monopoly-like board ring of coloured tiles
  const n = 9, tile = size / n, cols = ['#8e44ad', '#3498db', '#e67e22', RED, YEL, GREEN, '#1abc9c', '#e84393'];
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(t * .3) * .03);
  rr(-size / 2, -size / 2, size, size, 16); ctx.fillStyle = '#e8efe4'; ctx.globalAlpha = k; ctx.fill();
  let idx = 0;
  for (let side = 0; side < 4; side++) for (let i = 0; i < n - 1; i++) {
    const d = clamp(k * 40 - idx * .9); idx++;
    if (d <= 0) continue;
    let x, y; const p = -size / 2 + i * tile;
    if (side === 0) { x = p; y = -size / 2; } else if (side === 1) { x = size / 2 - tile; y = p; } else if (side === 2) { x = -p - tile; y = size / 2 - tile; } else { x = -size / 2; y = -p - tile; }
    ctx.globalAlpha = d; ctx.fillStyle = cols[(i + side * 2) % cols.length]; ctx.fillRect(x + 4, y + 4, tile - 8, tile * .3);
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.strokeRect(x + 2, y + 2, tile - 4, tile - 4);
  }
  ctx.globalAlpha = k; ctx.fillStyle = RED; ctx.font = font(900, size * .1); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.rotate(-.5); ctx.fillText('MONOPOLY', 0, 0); ctx.restore();
  // moving token
  const q = (t * .25) % 1, per = q * 4, s = Math.floor(per), f = per - s, h = size / 2 - tile / 2;
  const P = [[-h, -h], [h, -h], [h, h], [-h, h], [-h, -h]];
  ctx.fillStyle = BG; ctx.beginPath(); ctx.arc(lerp(P[s][0], P[s + 1][0], f), lerp(P[s][1], P[s + 1][1], f), tile * .22, 0, 7); ctx.fill();
  ctx.restore();
}
function s2(t) {                                                          // 1989 · the game launches
  const [a, b] = SC[1];
  board(CX, 1060, 760, t, eOut(prog(t, a, a + .8)));
  // the four steps of the mechanic, one icon each
  const steps = [['КУПИЛ', K.kupil], ['НАКЛЕИЛ', K.nakleil], ['СОБРАЛ', K.sobral], ['ВЫИГРАЛ', K.vyigral]];
  steps.forEach(([s, at], i) => plate(s, 190 + i * 233, 1560, t, at, K.prizy - .1, { col: i === 3 ? YEL : WHITE, size: 32 }));
  if (t > K.nakleil) cup(CX - 180, 1080, .9 * pop(t, K.nakleil, .4), { win: false, rot: -.08 });
  // prize ladder after «Призы»
  if (t > K.prizy) {
    const tiers = [['КАРТОШКА', K.kartoshka - .3], ['$1 000', K.kartoshka + .2], ['$1 000 000', K.million2]];
    tiers.forEach(([s, at], i) => plate(s, CX, 1500 + i * 0 - (2 - i) * 0 + (i - 1) * 0 + 0, t, at, i < 2 ? (tiers[i + 1][1]) : b, { col: i === 2 ? YEL : WHITE, size: i === 2 ? 76 : 50 }));
    if (t > K.million2) { const fl = .5 + .5 * Math.sin(t * 14); ctx.save(); ctx.globalAlpha = .1 * fl; ctx.fillStyle = YEL; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  }
  title([['1989', YEL, 120], ['АКЦИЯ «МОНОПОЛИЯ»', WHITE, 80]], t, a, b, 400);
}
function s3(t) {                                                          // queues & sales up
  const [a, b] = SC[2];
  // chart
  const k = eInOut(prog(t, K.prodazhi - .3, K.prodazhi + 2.2));
  const x0 = 150, y0 = 1080, w = 780, h = 420;
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y0 - h); ctx.lineTo(x0, y0); ctx.lineTo(x0 + w, y0); ctx.stroke();
  const pts = [0, .1, .18, .32, .4, .58, .7, .88, 1].map((v, i, arr) => [x0 + w * i / (arr.length - 1), y0 - h * v * .9 - Math.sin(t * 3 + i) * 4]);
  const n = Math.max(1, Math.floor(k * (pts.length - 1)));
  ctx.strokeStyle = YEL; ctx.lineWidth = 12; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i <= n; i++) ctx.lineTo(...pts[i]);
  const f = k * (pts.length - 1) - n; if (n < pts.length - 1) ctx.lineTo(lerp(pts[n][0], pts[n + 1][0], f), lerp(pts[n][1], pts[n + 1][1], f)); ctx.stroke();
  if (k > .95) arrow(pts[7][0], pts[7][1], pts[8][0] + 30, pts[8][1] - 30, 1, YEL, 12);
  plate('ПРОДАЖИ ↑', 780, 560, t, K.prodazhi, b, { size: 40 });
  // queue at the counter, people shuffling forward
  ctx.save(); ctx.fillStyle = '#2a2f3c'; rr(60, 1330, 260, 200, 18); ctx.fill(); ctx.fillStyle = RED; ctx.fillRect(60, 1330, 260, 40);
  ctx.fillStyle = WHITE; ctx.font = font(900, 30); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('КАССА', 190, 1352); ctx.restore();
  const step = (t * 60) % 150;
  for (let i = 0; i < 8; i++) { const x = 400 + i * 150 - step; if (x < 330 || x > 1150) continue;
    person(x, 1400, .62, { col: ['#3a4152', '#4a3b52', '#3b5247', '#52463b'][i % 4], bob: Math.abs(Math.sin(t * 6 + i)) * -10, hold: i % 3 ? null : 'ticket' }); }
  title([['ТЫСЯЧИ ЛЮДЕЙ.', WHITE, 92], ['МИЛЛИОНЫ ЧЕКОВ.', YEL, 92]], t, a, b, 400);
  plate('ПОВТОР КАЖДЫЙ ГОД', CX, 1720, t, K.povtoryali, b, { col: WHITE, size: 36 });
}
function s4(t) {                                                          // Jerome Jacobson
  const [a, b] = SC[3];
  const k = eOut(prog(t, K.chelovek - .2, K.chelovek + .6));
  // spotlight
  const g = ctx.createRadialGradient(CX, 1050, 0, CX, 1050, 520); g.addColorStop(0, `rgba(255,255,255,${.14 * k})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 400, W, 1300);
  ctx.save(); ctx.globalAlpha = k; person(CX, 950 + (1 - k) * 60, 2.2, { col: '#1d2230', head: '#1d2230', badge: t > K.policeiskiy, bob: Math.sin(t * 1.5) * 6 }); ctx.restore();
  // ID badge on a lanyard
  const kb = pop(t, K.rukovodil, .45);
  if (kb > 0) { ctx.save(); ctx.translate(CX + 260, 1300); ctx.rotate(.08 + Math.sin(t * 2) * .03); ctx.scale(kb, kb);
    rr(-130, -170, 260, 340, 20); ctx.fillStyle = WHITE; ctx.fill(); ctx.fillStyle = RED; ctx.fillRect(-130, -170, 260, 70);
    ctx.fillStyle = WHITE; ctx.font = font(900, 30); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('SECURITY', 0, -134);
    ctx.fillStyle = '#c9ced8'; ctx.beginPath(); ctx.arc(0, -10, 62, 0, 7); ctx.fill(); ctx.fillStyle = BG; ctx.font = font(900, 26); ctx.fillText('J. JACOBSON', 0, 110); ctx.restore(); }
  plate('ЭКС-ПОЛИЦЕЙСКИЙ', 300, 1560, t, K.policeiskiy, b, { col: WHITE, size: 36 });
  plate('НАЧАЛЬНИК БЕЗОПАСНОСТИ', CX, 1680, t, K.rukovodil, b, { size: 40 });
  title([['ДЖЕРОМ', WHITE, 120], ['ДЖЕКОБСОН', YEL, 120]], t, K.dzherom - .2, b, 420);
  if (t < K.dzherom - .2) title([['НИКТО НЕ ЗНАЛ', WHITE, 96]], t, a, K.dzherom - .2, 420);
}
function s5(t) {                                                          // only he knew where the prizes were
  const [a, b] = SC[4];
