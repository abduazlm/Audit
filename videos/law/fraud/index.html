<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Fraud Reel</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>html, body { margin: 0; background: #0c0e14; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ------------------------------------------------------------------------------------------
// Юридические ролики: «Интернет-мошенничество: первые 24 часа». Generated by videos/law/build.py — edit fraud/scenes.js or common-props.js.
// Series style of the case reels: flat vector on dark, yellow = key words, red = threat. Deterministic: renderFrame(t).
// ------------------------------------------------------------------------------------------
const W = 1080, H = 1920, CX = W / 2;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; cv.style.width = W + 'px';
const ctx = cv.getContext('2d');
const BG = '#0c0e14', BG2 = '#161a24', YEL = '#ffcc1a', RED = '#ff3b30', WHITE = '#ffffff', GREY = '#8a90a0', GREEN = '#2ecc71';
const F = 'Montserrat, Arial Black, sans-serif';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a, d = .35) => eBack(prog(t, a, a + d));
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const font = (w, s) => `${w} ${Math.round(s)}px ${F}`;
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- text ----------
function title(lines, t, a, b, y = 330) {                                // big scene phrase, ≤4 words, yellow for key words
  const k = eOut(prog(t, a, a + .35)), ko = prog(t, b - .2, b);
  if (k <= 0 || ko >= 1) return;
  ctx.save(); ctx.globalAlpha = k * (1 - ko); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  lines.forEach(([text, col, size = 96], i) => {
    const d = eOut(prog(t, a + i * .12, a + i * .12 + .4));
    let s = size; ctx.font = font(900, s); ctx.letterSpacing = `${-s * .02}px`;
    const w = ctx.measureText(text).width; if (w > W * .88) { s *= W * .88 / w; ctx.font = font(900, s); }
    ctx.fillStyle = col || WHITE; ctx.globalAlpha = k * (1 - ko) * d;
    ctx.fillText(text, CX, y + i * s * 1.08 + (1 - d) * 30);
    y += 0;
  });
  ctx.restore();
}
function plate(text, x, y, t, a, b = 1e9, o = {}) {                       // label plate: «схема», «12 лет», «$24 млн»
  const k = pop(t, a, .4), ko = prog(t, b - .2, b);
  if (k <= 0 || ko >= 1) return;
  const { col = YEL, ink = BG, size = 44, rot = 0 } = o;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k); ctx.globalAlpha = 1 - ko;
  ctx.font = font(900, size); ctx.letterSpacing = '1px';
  const w = ctx.measureText(text).width + size * 1.1, h = size * 1.7;
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 20; rr(-w / 2, -h / 2, w, h, 14); ctx.fillStyle = col; ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, size * .06);
  ctx.restore();
}

// ---------- background: dark, slow drifting grid + vignette, so no frame is ever still ----------
function bg(t) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 2;
  const s = 90, off = (t * 10) % s;
  for (let x = -s; x < W + s; x += s) { ctx.beginPath(); ctx.moveTo(x + off, 0); ctx.lineTo(x + off, H); ctx.stroke(); }
  for (let y = -s; y < H + s; y += s) { ctx.beginPath(); ctx.moveTo(0, y + off * .6); ctx.lineTo(W, y + off * .6); ctx.stroke(); }
  for (let i = 0; i < 30; i++) {                                         // dust
    const x = (hash(i) * W + t * (6 + hash(i + 3) * 10)) % W, y = (hash(i + 7) * H - t * (10 + hash(i + 5) * 20) % H + H) % H;
    ctx.fillStyle = `rgba(255,204,26,${.05 + .08 * hash(i + 2)})`; ctx.beginPath(); ctx.arc(x, y, 2 + 3 * hash(i + 4), 0, 7); ctx.fill();
  }
  const g = ctx.createRadialGradient(CX, H * .5, H * .25, CX, H * .5, H * .8);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function chrome(t, n) {
  ctx.save(); ctx.globalAlpha = prog(t, .2, .6);
  ctx.textBaseline = 'alphabetic'; ctx.font = font(800, 26); ctx.letterSpacing = '4px';
  ctx.fillStyle = GREY; ctx.textAlign = 'left'; ctx.fillText(LABEL, 70, 190);
  ctx.textAlign = 'right'; ctx.fillStyle = YEL; ctx.fillText(`${String(n).padStart(2, '0')} / ${SC.length}`, W - 70, 190);
  const p = t / DURATION;                                                // thin progress line
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(70, 212, W - 140, 4); ctx.fillStyle = YEL; ctx.fillRect(70, 212, (W - 140) * p, 4);
  ctx.restore();
}

// ---------- props ----------
function cup(x, y, s, o = {}) {                                          // soda cup with a game sticker
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(o.rot || 0);
  ctx.fillStyle = '#e8e8e8'; rr(-70, -150, 140, 22, 10); ctx.fill();
  ctx.fillStyle = WHITE; ctx.fillRect(-12, -200, 14, 60);                // straw
  ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(-64, -130); ctx.lineTo(64, -130); ctx.lineTo(48, 120); ctx.lineTo(-48, 120); ctx.closePath(); ctx.fill();
  ctx.fillStyle = YEL; ctx.beginPath(); ctx.moveTo(-60, -60); ctx.lineTo(60, -60); ctx.lineTo(57, -36); ctx.lineTo(-57, -36); ctx.closePath(); ctx.fill();
  if (o.sticker !== false) sticker(0, 30, .55, o.peel || 0, o.win);
  ctx.restore();
}
function fries(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = YEL; for (let i = 0; i < 7; i++) { ctx.save(); ctx.translate(-48 + i * 16, -40); ctx.rotate((i - 3) * .06); ctx.fillRect(-7, -90, 14, 100); ctx.restore(); }
  ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(-70, -50); ctx.quadraticCurveTo(0, -20, 70, -50); ctx.lineTo(55, 90); ctx.lineTo(-55, 90); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function sticker(x, y, s, peel = 0, win = false) {                         // game piece sticker (peel = 0..1 lifts a corner)
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rr(-80, -60, 160, 120, 14); ctx.fillStyle = WHITE; ctx.fill();
  ctx.fillStyle = win ? YEL : '#2f6fdf'; ctx.fillRect(-80, -60, 160, 34);
  ctx.fillStyle = BG; ctx.font = font(900, 26); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(win ? '$1 000 000' : 'BOARDWALK', 0, 16);
  if (peel > 0) { ctx.fillStyle = '#d8d8d8'; ctx.beginPath(); ctx.moveTo(80, 60); ctx.lineTo(80 - 70 * peel, 60); ctx.lineTo(80, 60 - 60 * peel); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function person(x, y, s, o = {}) {                                        // flat silhouette; o.col body colour, o.badge, o.hat
  const { col = '#3a4152', head = '#4a5266', badge = false, bob = 0, hold } = o;
  ctx.save(); ctx.translate(x, y + bob); ctx.scale(s, s);
  rr(-70, 40, 140, 200, 60); ctx.fillStyle = col; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -20, 58, 0, 7); ctx.fillStyle = head; ctx.fill();
  if (badge) { ctx.fillStyle = YEL; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 12 : 26; ctx.lineTo(-30 + Math.cos(a) * r, 100 + Math.sin(a) * r); } ctx.closePath(); ctx.fill(); }
  if (hold === 'ticket') { ctx.save(); ctx.translate(70, 120); ctx.rotate(-.2); rr(-40, -26, 80, 52, 6); ctx.fillStyle = WHITE; ctx.fill(); ctx.fillStyle = YEL; ctx.fillRect(-40, -26, 80, 16); ctx.restore(); }
  if (hold === 'check') { ctx.save(); ctx.translate(70, 110); ctx.rotate(-.15); rr(-70, -30, 140, 60, 6); ctx.fillStyle = GREEN; ctx.fill(); ctx.fillStyle = WHITE; ctx.font = font(900, 26); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$$$', 0, 2); ctx.restore(); }
  if (hold === 'env') { ctx.save(); ctx.translate(70, 120); rr(-44, -30, 88, 60, 6); ctx.fillStyle = '#e9d9b0'; ctx.fill(); ctx.strokeStyle = '#b89c5a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-44, -30); ctx.lineTo(0, 4); ctx.lineTo(44, -30); ctx.stroke(); ctx.restore(); }
  ctx.restore();
}
function arrow(x1, y1, x2, y2, k, col = YEL, w = 8) {
  if (k <= 0) return;
  const x = lerp(x1, x2, k), y = lerp(y1, y2, k), a = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 18, y + Math.sin(a) * 18); ctx.lineTo(x + Math.cos(a + 2.4) * 22, y + Math.sin(a + 2.4) * 22); ctx.lineTo(x + Math.cos(a - 2.4) * 22, y + Math.sin(a - 2.4) * 22); ctx.fill();
}
function qmark(x, y, s, t, a) {
  const k = pop(t, a, .45); if (k <= 0) return;
  ctx.save(); ctx.translate(x, y + Math.sin(t * 4) * 8); ctx.scale(k * s, k * s);
  ctx.shadowColor = 'rgba(255,59,48,.6)'; ctx.shadowBlur = 30; ctx.fillStyle = RED; ctx.font = font(900, 160); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 0, 0); ctx.restore();
}
function money(n) { return '$' + Math.round(n).toLocaleString('ru-RU').replace(/ /g, ' '); }

// ---------- props shared by the legal reels (inlined into each index.html by build.py) ----------
const INK = '#0c0e14';
function xmark(x, y, s, k) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(s * k, s * k);
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fillStyle = RED; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-13, -13); ctx.lineTo(13, 13); ctx.moveTo(13, -13); ctx.lineTo(-13, 13); ctx.stroke(); ctx.restore(); }
function check(x, y, s, k, col = GREEN) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(s * k, s * k);
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = WHITE; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-14, 1); ctx.lineTo(-4, 12); ctx.lineTo(15, -11); ctx.stroke(); ctx.restore(); }
function txt(s, x, y, size, col, align = 'center', w = 900) {
  ctx.font = font(w, size); ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function phone(x, y, s, draw) {                                          // smartphone; draw() paints the screen (origin = screen centre)
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rr(-150, -290, 300, 580, 44); ctx.fillStyle = '#20242f'; ctx.fill();
  rr(-134, -262, 268, 524, 30); ctx.fillStyle = '#eef1f6'; ctx.fill();
  ctx.save(); rr(-134, -262, 268, 524, 30); ctx.clip(); if (draw) draw(); ctx.restore();
  rr(-40, -280, 80, 12, 6); ctx.fillStyle = '#20242f'; ctx.fill();
  ctx.restore();
}
function bankCard(x, y, s, rot, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 20; rr(-120, -76, 240, 152, 16); ctx.fillStyle = col; ctx.fill(); ctx.shadowBlur = 0;
  rr(-92, -30, 44, 34, 6); ctx.fillStyle = YEL; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; for (let i = 0; i < 4; i++) rr(-92 + i * 48, 30, 38, 10, 5), ctx.fill();
  ctx.restore();
}
function paper(x, y, s, title, t, a, o = {}) {                            // document whose lines write themselves from time a
  const { lines = 6, w = 300, h = 400, rot = 0 } = o;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 24; rr(-w / 2, -h / 2, w, h, 14); ctx.fillStyle = '#f6f7fb'; ctx.fill(); ctx.shadowBlur = 0;
  txt(title, 0, -h / 2 + 50, 30, INK);
  for (let i = 0; i < lines; i++) {
    const k = eOut(prog(t, a + i * .18, a + .3 + i * .18)); if (k <= 0) continue;
    const lw = (w - 80) * (i % 3 === 2 ? .6 : .9);
    rr(-w / 2 + 40, -h / 2 + 100 + i * 42, lw * k, 12, 6); ctx.fillStyle = '#b9c0cf'; ctx.fill();
  }
  ctx.restore();
}
function stamp(x, y, s, k, text) {
  if (k <= 0) return; const sc = lerp(1.8, 1, eOut(clamp(k)));
  ctx.save(); ctx.translate(x, y); ctx.rotate(-.18); ctx.scale(s * sc, s * sc); ctx.globalAlpha = clamp(k * 2);
  ctx.strokeStyle = RED; ctx.lineWidth = 8; rr(-130, -50, 260, 100, 16); ctx.stroke(); txt(text, 0, 4, 40, RED);
  ctx.restore();
}
function folder(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#c9932e'; rr(-200, -150, 160, 50, 14); ctx.fill(); rr(-200, -120, 400, 270, 20); ctx.fill();
  ctx.fillStyle = '#f2b63d'; rr(-200, -70, 400, 220, 20); ctx.fill();
  ctx.restore();
}
function scales(x, y, s, t) {                                            // scales of justice, gently balancing
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = YEL; ctx.strokeStyle = YEL; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.fillRect(-8, -170, 16, 330); rr(-110, 150, 220, 30, 12); ctx.fill(); ctx.beginPath(); ctx.arc(0, -180, 18, 0, 7); ctx.fill();
  const a = Math.sin(t * 1.6) * .12; ctx.save(); ctx.translate(0, -150); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(-220, 0); ctx.lineTo(220, 0); ctx.stroke();
  [-1, 1].forEach(sx => { ctx.save(); ctx.translate(sx * 210, 0); ctx.rotate(-a); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60, 120); ctx.moveTo(0, 0); ctx.lineTo(60, 120); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 125, 80, 22, 0, 0, Math.PI); ctx.fill(); ctx.restore(); });
  ctx.restore(); ctx.restore();
}
function bankBuilding(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = '#c9ced8';
  ctx.beginPath(); ctx.moveTo(-170, -80); ctx.lineTo(0, -170); ctx.lineTo(170, -80); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 5; i++) ctx.fillRect(-140 + i * 64, -60, 30, 180); ctx.fillRect(-170, 120, 340, 30);
  txt('БАНК', 0, -105, 32, BG); ctx.restore();
}
function clock(x, y, s, t, col = RED) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.arc(0, 0, 90, 0, 7); ctx.fillStyle = BG2; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 10; ctx.stroke();
  ctx.lineCap = 'round'; ctx.strokeStyle = WHITE; ctx.lineWidth = 8;
  ctx.save(); ctx.rotate(t * 4); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -66); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.rotate(t * .35); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -42); ctx.stroke(); ctx.restore();
  ctx.restore();
}
function gavel(x, y, s, ang) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rr(-130, 90, 260, 40, 12); ctx.fillStyle = '#7a4a24'; ctx.fill();
  ctx.save(); ctx.translate(90, 60); ctx.rotate(ang);
  rr(-200, -12, 200, 24, 10); ctx.fillStyle = '#a0672f'; ctx.fill(); rr(-250, -50, 90, 100, 18); ctx.fillStyle = '#7a4a24'; ctx.fill();
  ctx.restore(); ctx.restore();
}
function lawBook(x, y, s, open) {                                        // book that opens (open 0..1) with light rays
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (open > 0) { ctx.save(); ctx.globalAlpha = open * .5; ctx.fillStyle = YEL;
    for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.moveTo(0, -20); const a = -Math.PI / 2 + (i - 3) * .22; ctx.lineTo(Math.cos(a - .05) * 420, Math.sin(a - .05) * 420); ctx.lineTo(Math.cos(a + .05) * 420, Math.sin(a + .05) * 420); ctx.fill(); }
    ctx.restore(); }
  const w = 220 * lerp(.5, 1, open);
  [-1, 1].forEach(sx => { ctx.save(); ctx.scale(sx, 1); ctx.beginPath(); ctx.moveTo(0, -120); ctx.quadraticCurveTo(w * .5, -140, w, -110); ctx.lineTo(w, 130); ctx.quadraticCurveTo(w * .5, 100, 0, 120); ctx.closePath();
    ctx.fillStyle = sx < 0 ? '#e9ecf3' : '#f6f7fb'; ctx.fill(); ctx.fillStyle = '#b9c0cf'; for (let i = 0; i < 5; i++) ctx.fillRect(30, -60 + i * 36, (w - 60) * open, 8); ctx.restore(); });
  ctx.fillStyle = '#7a2a2a'; rr(-12, -125, 24, 255, 8); ctx.fill();
  ctx.restore();
}
function snowball(x, y, r, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * .8);
  const g = ctx.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#a9bcd6');
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = 'rgba(80,100,140,.25)'; for (let i = 0; i < 9; i++) { const a = hash(i) * 6.28, d = r * .6 * hash(i + 2); ctx.beginPath(); ctx.arc(Math.cos(a) * d, Math.sin(a) * d, r * .08, 0, 7); ctx.fill(); }
  ctx.restore();
}
function pill(x, y, s, text, col, ink, t) {                              // CTA button with a soft pulse
  const p = 1 + .03 * Math.sin(t * 5);
  ctx.save(); ctx.translate(x, y); ctx.scale(s * p, s * p);
  ctx.font = font(900, 54); const w = ctx.measureText(text).width + 120;
  ctx.shadowColor = col; ctx.shadowBlur = 40; rr(-w / 2, -70, w, 140, 70); ctx.fillStyle = col; ctx.fill(); ctx.shadowBlur = 0;
  txt(text, 0, 4, 54, ink); ctx.restore();
}
function shieldT(x, y, s, k, text, col = '#1e3a8a') {
  if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(s * k, s * k);
  ctx.fillStyle = col; ctx.strokeStyle = YEL; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(0, -90); ctx.lineTo(75, -65); ctx.quadraticCurveTo(75, 40, 0, 95); ctx.quadraticCurveTo(-75, 40, -75, -65); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore(); if (text) { ctx.save(); ctx.translate(x, y); ctx.scale(s * k, s * k); txt(text, 0, 4, 26, WHITE); ctx.restore(); }
}
// final scene: free consultation call to action (same in both reels)
function cta(t, a, b, sub, tap) {
  const kb = pop(t, a + .4, .5);
  if (kb > 0) pill(CX, 1120, kb, 'ОСТАВИТЬ ЗАЯВКУ', YEL, BG, t);
  const tp = Math.sin(Math.PI * prog(t, tap, tap + .25)), rp = prog(t, tap + .1, tap + .7);
  if (rp > 0 && rp < 1) { ctx.strokeStyle = `rgba(255,255,255,${1 - rp})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(CX + 300, 1130, 30 + rp * 150, 0, 7); ctx.stroke(); }
  if (t > tap - .4) { ctx.save(); ctx.translate(CX + 320, 1215 - tp * 30); ctx.fillStyle = '#c99a6b'; rr(-30, -10, 60, 120, 28); ctx.fill(); rr(-16, -60, 32, 70, 16); ctx.fill(); ctx.restore(); }
  plate(sub, CX, 1360, t, a + 1.2, b + 1, { col: WHITE, size: 38 });
  title([['БЕСПЛАТНАЯ', YEL, 120], ['КОНСУЛЬТАЦИЯ', WHITE, 100]], t, a, b + 1, 470);
}

// «Интернет-мошенничество: первые 24 часа» — timing from assets/vo-timing.json (Piper «Руслан»)
const VO = [0.5, 4.3, 12.58, 19.31, 25.9, 31.99, 39.49, 46.06, 53.79];
const DURATION = 61.41;
const SC = VO.map((s, i) => [i ? s - .3 : 0, i < VO.length - 1 ? VO[i + 1] - .3 : DURATION]);
const K = {
  bank: 1.22, nol: 3.3,
  zvonok: 4.26, ssylka: 6.34, kod: 8.2, raznye: 10.0, dengi: 11.48,
  cepochke: 14.3, vremeni: 16.24, dognat: 18.06,
  bank2: 21.56, zablok: 22.36, soobshite: 23.48,
  zayavlenie: 27.46, osnova: 29.26,
  skrin: 34.18, nomera: 35.34, ssylki: 35.76, cheki: 36.18, nichego: 37.28,
  forma: 42.3, antifrod: 43.22,
  zayavleniya: 47.84, dvizhenie: 48.98, vozvrat: 50.46,
  zayavku: 55.9, konsult: 57.24, razberem: 58.46
};
