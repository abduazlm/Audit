<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-400-latin.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }

      :root {
        --bg: #0a0c12;
        --ink: #f5f3ff;
        --accent-0: #a78bfa;
        --accent-1: #e8c468;
        --accent-2: #7ee8c8;
        --accent-3: #f5f3ff;
        --accent-4: #7c6bff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .video-wrapper {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        border-radius: 0;
        box-shadow: none;
      }
      .video-wrapper video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .legibility {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.5) 0%,
          transparent 20%,
          transparent 55%,
          rgba(0, 0, 0, 0.6) 100%
        );
      }
      .card-host {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
        overflow: hidden;
        z-index: 3;
      }
      .card-host .card {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="talking-head-recut"
      data-start="0"
      data-duration="12.133"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div class="video-wrapper" id="video-wrap">
        <video
          id="bg-video"
          src="input-video.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="12.133"
          data-track-index="1"
        ></video>
      </div>
      <audio
        id="source-audio"
        src="input-video.mp4"
        data-start="0"
        data-duration="12.133"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div class="legibility"></div>

      <div
        class="card-host clip"
        data-card-id="card-01"
        id="host-card-01"
        data-start="0.4000"
        data-duration="3.1500"
        data-track-index="2"
        style="visibility: hidden; opacity: 0"
      >
        <div class="card" data-card-id="card-01">
          <style>
            .card[data-card-id="card-01"] .root {
              width: 100%;
              height: 100%;
              position: relative;
              font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
            }
            .card[data-card-id="card-01"] .scrim {
              position: absolute;
              left: 0;
              right: 0;
              bottom: 0;
              top: 1020px;
              padding: 0 64px 320px;
              box-sizing: border-box;
              background: linear-gradient(
                to top,
                rgba(6, 7, 12, 0.85) 0%,
                rgba(6, 7, 12, 0.55) 40%,
                rgba(6, 7, 12, 0) 100%
              );
              backdrop-filter: blur(16px);
              -webkit-backdrop-filter: blur(16px);
              -webkit-mask-image: linear-gradient(to top, black 0%, black 40%, transparent 100%);
              mask-image: linear-gradient(to top, black 0%, black 40%, transparent 100%);
              display: flex;
              flex-direction: column;
              justify-content: flex-end;
              gap: 20px;
            }
            .card[data-card-id="card-01"] .kicker {
              display: flex;
              align-items: center;
              gap: 12px;
              font: 700 26px/1 "Inter", sans-serif;
              letter-spacing: 0.16em;
              color: #a78bfa;
              text-transform: uppercase;
              text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            }
            .card[data-card-id="card-01"] .kicker-dot {
              width: 10px;
              height: 10px;
              border-radius: 50%;
              background: #a78bfa;
              box-shadow: 0 0 18px #a78bfa;
            }
            .card[data-card-id="card-01"] .title {
              margin: 0;
              font: 800 76px/1.18 "Inter", sans-serif;
              color: #f5f3ff;
              white-space: pre-line;
              text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            }
          </style>
          <div class="root">
            <div class="scrim">
              <div class="kicker" id="card-01-kicker"><span class="kicker-dot"></span>🤲 Дуа дня</div>
              <h2 class="title" id="card-01-title">Дуа, которое поможет
выплатить долги</h2>
            </div>
          </div>
        </div>
      </div>

      <div
        class="card-host clip"
        data-card-id="card-02"
        id="host-card-02"
        data-start="3.6500"
        data-duration="2.9300"
        data-track-index="2"
        style="visibility: hidden; opacity: 0"
      >
        <div class="card" data-card-id="card-02">
          <style>
            .card[data-card-id="card-02"] .root {
              width: 100%;
              height: 100%;

              font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
            }

            .card[data-card-id="card-02"] .kicker {

            .card[data-card-id="card-02"] .arabic {

              text-shadow: 0 4px 24px rgba(0, 0, 0, 0.65);
            }
            .card[data-card-id="card-02"] .translit {

              color: #cbc8e6;
              font-style: italic;
              text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            }
          </style>
          <div class="root">
            <div class="scrim">
              <div class="kicker" id="card-02-kicker"><span class="kicker-dot"></span>1 / 2</div>
              <p class="arabic" id="card-02-arabic">اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ</p>
              <p class="translit" id="card-02-translit">Аллохумма кфини би халялика ан харомика</p>
            </div>
          </div>
        </div>
      </div>

      <div
        class="card-host clip"
        data-card-id="card-03"
        id="host-card-03"
        data-start="6.6800"
        data-duration="2.7200"
        data-track-index="2"
        style="visibility: hidden; opacity: 0"
      >
        <div class="card" data-card-id="card-03">
          <style>
            .card[data-card-id="card-03"] .root {
              width: 100%;
              height: 100%;
              position: relative;
              font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
            }
            .card[data-card-id="card-03"] .scrim {
              position: absolute;
              left: 0;

              top: 980px;
              padding: 0 64px 320px;

              background: linear-gradient(
                to top,

              backdrop-filter: blur(16px);

              mask-image: linear-gradient(to top, black 0%, black 40%, transparent 100%);
              display: flex;

              gap: 24px;
            }
            .card[data-card-id="card-03"] .kicker {
              display: flex;

              text-transform: uppercase;
              text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);

            .card[data-card-id="card-03"] .kicker-dot {

            }
            .card[data-card-id="card-03"] .arabic {

              text-shadow: 0 4px 24px rgba(0, 0, 0, 0.65);
            }
            .card[data-card-id="card-03"] .translit {
              margin: 0;
              font: 500 34px/1.4 "Inter", sans-serif;
              color: #cbc8e6;
              font-style: italic;
              text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            }
          </style>
          <div class="root">
            <div class="scrim">
              <div class="kicker" id="card-03-kicker"><span class="kicker-dot"></span>2 / 2</div>
              <p class="arabic" id="card-03-arabic">وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ</p>
              <p class="translit" id="card-03-translit">уа агнини бифадлика амман сиуак</p>
            </div>
          </div>
        </div>
      </div>

      <div
        class="card-host clip"
        data-card-id="card-04"
        id="host-card-04"
        data-start="9.5000"
        data-duration="2.6330"
        data-track-index="2"
        style="visibility: hidden; opacity: 0"
      >
        <div class="card" data-card-id="card-04">
          <style>
            .card[data-card-id="card-04"] .root {
              width: 100%;
              height: 100%;
              position: relative;
              font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
            }
            .card[data-card-id="card-04"] .scrim {
              position: absolute;
              left: 0;
              right: 0;
              bottom: 0;
              top: 1170px;
              padding: 0 64px 340px;
              box-sizing: border-box;
              background: linear-gradient(
                to top,
                rgba(6, 7, 12, 0.82) 0%,
                rgba(6, 7, 12, 0.5) 45%,
                rgba(6, 7, 12, 0) 100%
              );
              backdrop-filter: blur(14px);
              -webkit-backdrop-filter: blur(14px);
              -webkit-mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
              mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
              display: flex;
              flex-direction: column;
              justify-content: flex-end;
              align-items: center;
              gap: 20px;
              text-align: center;
            }
            .card[data-card-id="card-04"] .icon {
              font-size: 54px;
              color: #f5f3ff;
            }
            .card[data-card-id="card-04"] .title {
              margin: 0;
              font: 800 58px/1.25 "Inter", sans-serif;
              color: #f5f3ff;
              white-space: pre-line;
              text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            }
          </style>
          <div class="root">
            <div class="scrim">
              <span class="icon" id="card-04-icon">📖</span>
              <h2 class="title" id="card-04-title">Перевод и транскрипция —
в описании</h2>
            </div>
          </div>
        </div>
      </div>

      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const tl = window.gsap.timeline({ paused: true });

          // ── Card 01 — hook (kicker + title together), lands at speech onset ~0.43s ──
          tl.set('.card-host[data-card-id="card-01"]', { visibility: "visible" }, 0.4);
          tl.fromTo(
            '.card-host[data-card-id="card-01"]',
            { opacity: 0 },
            { opacity: 1, duration: 0.2, ease: "power2.out" },
            0.4,
          );
          tl.fromTo(
            '.card[data-card-id="card-01"] #card-01-kicker',
            { opacity: 0 },
            { opacity: 1, duration: 0.2, ease: "power2.out" },
            0.45,
          );
          tl.fromTo(
            '.card[data-card-id="card-01"] #card-01-title',
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
            0.5,
          );
          tl.to(
            '.card-host[data-card-id="card-01"]',
            { opacity: 0, duration: 0.25, ease: "power2.in" },
            3.3,
          );
          tl.set('.card-host[data-card-id="card-01"]', { visibility: "hidden" }, 3.55);

          // ── Card 02 — arabic part 1, lands at speech onset ~3.70s ──
          tl.set('.card-host[data-card-id="card-02"]', { visibility: "visible" }, 3.65);
          tl.fromTo(
            '.card-host[data-card-id="card-02"]',
            { opacity: 0 },
            { opacity: 1, duration: 0.2, ease: "power2.out" },
            3.65,
          );
          tl.fromTo(
            '.card[data-card-id="card-02"] #card-02-kicker',
            { opacity: 0 },
            { opacity: 1, duration: 0.2, ease: "power2.out" },
            3.7,
          );
          tl.fromTo(
            '.card[data-card-id="card-02"] #card-02-arabic',
            { clipPath: "inset(0 0 0 100%)" },
            { clipPath: "inset(0 0 0 0%)", duration: 0.4, ease: "power2.inOut" },
            3.75,
          );
          tl.fromTo(
            '.card[data-card-id="card-02"] #card-02-translit',
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
            4.15,
          );
          tl.to(
            '.card-host[data-card-id="card-02"]',
            { opacity: 0, duration: 0.25, ease: "power2.in" },
            6.33,
          );
          tl.set('.card-host[data-card-id="card-02"]', { visibility: "hidden" }, 6.58);

          // ── Card 03 — arabic part 2, lands at speech onset ~6.73s ──
          tl.set('.card-host[data-card-id="card-03"]', { visibility: "visible" }, 6.68);
          tl.fromTo(
            '.card-host[data-card-id="card-03"]',
            { opacity: 0 },
            { opacity: 1, duration: 0.2, ease: "power2.out" },
            6.68,
          );
          tl.fromTo(
            '.card[data-card-id="card-03"] #card-03-kicker',
            { opacity: 0 },
            { opacity: 1, duration: 0.2, ease: "power2.out" },
            6.73,
          );
          tl.fromTo(
            '.card[data-card-id="card-03"] #card-03-arabic',
            { clipPath: "inset(0 0 0 100%)" },
            { clipPath: "inset(0 0 0 0%)", duration: 0.4, ease: "power2.inOut" },
            6.78,
          );
          tl.fromTo(
            '.card[data-card-id="card-03"] #card-03-translit',
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
            7.18,
          );
          tl.to(
            '.card-host[data-card-id="card-03"]',
            { opacity: 0, duration: 0.25, ease: "power2.in" },
            9.15,
          );
          tl.set('.card-host[data-card-id="card-03"]', { visibility: "hidden" }, 9.4);

          // ── Card 04 — outro CTA, lands at speech onset ~9.55s ──
          tl.set('.card-host[data-card-id="card-04"]', { visibility: "visible" }, 9.5);
          tl.fromTo(
            '.card-host[data-card-id="card-04"]',
            { opacity: 0 },
            { opacity: 1, duration: 0.2, ease: "power2.out" },
            9.5,
          );
          tl.fromTo(
            '.card[data-card-id="card-04"] #card-04-icon',
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" },
            9.55,
          );
          tl.fromTo(
            '.card[data-card-id="card-04"] #card-04-title',
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
            9.75,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["talking-head-recut"] = tl;
        })();
      </script>
