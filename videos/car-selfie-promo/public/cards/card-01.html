<div class="card" data-card-id="card-01">
  <style>
    .card[data-card-id="card-01"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    }
    .card[data-card-id="card-01"] .scrim {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 1600px;
      padding: 0 64px 140px;
      box-sizing: border-box;
      background: linear-gradient(
        to top,
        rgba(6, 7, 12, 0.82) 0%,
        rgba(6, 7, 12, 0.5) 45%,
        rgba(6, 7, 12, 0) 100%
      );
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      -webkit-mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
      mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
      display: flex;
      align-items: flex-end;
    }
    .card[data-card-id="card-01"] .chip {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card[data-card-id="card-01"] .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 18px #a78bfa, 0 0 4px #a78bfa;
      flex: 0 0 auto;
    }
    .card[data-card-id="card-01"] .label {
      font: 700 30px/1 "Inter", sans-serif;
      letter-spacing: 0.16em;
      color: #f5f3ff;
      text-transform: uppercase;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
    }
  </style>

  <div class="root">
    <div class="scrim">
      <div class="chip" id="card-01-chip">
        <span class="dot" id="card-01-dot"></span>
        <span class="label">🤲 Дуа дня</span>
      </div>
    </div>
  </div>
</div>
