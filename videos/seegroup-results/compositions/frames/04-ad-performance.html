<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #0d3a2c;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          opacity: 0;
        }
        .kicker-row {
          position: absolute;
          top: 108px;
          left: 0;
          right: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
          opacity: 0;
        }
        .kicker-dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #c99a3a;
          box-shadow: 0 0 14px #c99a3a;
        }
        .kicker-label {
          font-size: 34px;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #f4f1e9;
        }
        .stats-row {
          position: absolute;
          top: 300px;
          left: 0;
          right: 0;
          height: 560px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 72px;
        }
        .stat-card {
          width: 760px;
          height: 480px;
          border-radius: 28px;
          background: #104434;
          border: 1px solid rgba(163, 126, 45, 0.3);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 22px;
          opacity: 0;
          transform: translateY(30px);
        }
        .stat-value {
          font-size: 108px;
          font-weight: 800;
          color: #c99a3a;
          text-align: center;
          line-height: 1.05;
        }
        .stat-desc {
          font-size: 36px;
          font-weight: 600;
          color: #f4f1e9;
          text-align: center;
        }
        .stat-source {
          font-size: 26px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: rgba(244, 241, 233, 0.5);
        }
      </style>

      <div
        id="root"
        data-composition-id="ad-performance"
        data-width="1920"
        data-height="1080"
        data-duration="9.0"
      >
        <div class="kicker-row" id="ad-kicker">
          <span class="kicker-dot"></span>
          <span class="kicker-label">И в рекламе тоже работает</span>
        </div>

        <div class="stats-row">
          <div class="stat-card" id="ad-card-1">
            <div class="stat-value" id="ad-value-1">13,76%</div>
            <div class="stat-desc">CTR по лучшим креативам</div>
            <div class="stat-source">Cosmi.opt · Meta Ads</div>
          </div>
          <div class="stat-card" id="ad-card-2">
            <div class="stat-value" id="ad-value-2">$0,66</div>
            <div class="stat-desc">за результат · 2 415 заявок</div>
            <div class="stat-source">OWLY · Meta Ads</div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);
        tl.fromTo("#ad-kicker", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.15);

        tl.fromTo(
          "#ad-card-1",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.55,
        );
        tl.fromTo(
          "#ad-value-1",
          { scale: 0.7 },
          { scale: 1, duration: 0.35, ease: "back.out(1.6)" },
          0.7,
        );

        tl.fromTo(
          "#ad-card-2",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.95,
        );
        tl.fromTo(
          "#ad-value-2",
          { scale: 0.7 },
          { scale: 1, duration: 0.35, ease: "back.out(1.6)" },
          1.1,
        );

        // Hold, then soft dissolve out.
        tl.to("#root", { opacity: 0, duration: 0.35, ease: "power1.in" }, 8.5);

        window.__timelines["ad-performance"] = tl;
      </script>
    </template>
  </body>
</html>
