<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background-color: #0d3a2c;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          opacity: 0;
        }
        .center-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .lead-line {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 68px;
          font-weight: 700;
          color: #f4f1e9;
          text-align: center;
          opacity: 0;
        }
        .hours-block {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
        .hours-text {
          font-size: 150px;
          font-weight: 800;
          color: #f4f1e9;
          transform-origin: 50% 50%;
        }
        .settle-line {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 76px;
          font-weight: 800;
          line-height: 1.15;
          color: #f4f1e9;
          text-align: center;
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="guarantee"
        data-width="1920"
        data-height="1080"
        data-duration="5.5"
      >
        <div class="lead-line" id="gr-lead"><span>Гарантия на каждый проект</span></div>
        <div class="hours-block" id="gr-hours"><div class="hours-text">24 ЧАСА</div></div>
        <div class="settle-line" id="gr-settle"><span>Не смонтируем — вы не платите</span></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0);

        tl.fromTo("#gr-lead", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.1);
        tl.to("#gr-lead", { opacity: 0, duration: 0.2, ease: "power1.in" }, 0.9);

        // The one carmine urgency beat — background flash + spring-pop text.
        tl.to("#root", { backgroundColor: "#a20404", duration: 0.15, ease: "power2.out" }, 1.15);
        tl.fromTo(
          "#gr-hours",
          { opacity: 0 },
          { opacity: 1, duration: 0.15, ease: "power2.out" },
          1.2,
        );
        tl.fromTo(
          "#gr-hours .hours-text",
          { scale: 0.6 },
          { scale: 1, duration: 0.3, ease: "power3.out" },
          1.2,
        );

        tl.to("#root", { backgroundColor: "#0d3a2c", duration: 0.3, ease: "power1.inOut" }, 1.75);
        tl.to("#gr-hours", { opacity: 0, duration: 0.2, ease: "power1.in" }, 1.75);

        tl.fromTo(
          "#gr-settle",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          2.05,
        );

        // Hold, then soft dissolve out before the cut to the outro.
        tl.to("#root", { opacity: 0, duration: 0.3, ease: "power1.in" }, 5.15);

        window.__timelines["guarantee"] = tl;
      </script>
    </template>
  </body>
</html>
