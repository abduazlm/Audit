<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #0d3a2c;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          opacity: 0;
        }
        .checker {
          position: absolute;
          bottom: 72px;
          left: 96px;
          width: 200px;
          height: 200px;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          grid-template-rows: repeat(3, 1fr);
          opacity: 0;
        }
        .checker div:nth-child(odd) {
          background: #a37e2d;
        }
        .checker div:nth-child(even) {
          background: #104434;
        }
        .lockup-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 22px;
        }
        .lockup {
          font-size: 118px;
          font-weight: 700;
          color: #f4f1e9;
          transform-origin: 50% 50%;
        }
        .lockup .cap {
          font-weight: 800;
        }
        .tagline {
          font-size: 32px;
          font-weight: 600;
          letter-spacing: 0.06em;
          color: rgba(244, 241, 233, 0.65);
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="outro"
        data-width="1920"
        data-height="1080"
        data-duration="4.5"
      >
        <div class="checker" id="outro-checker">
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
        </div>
        <div class="lockup-wrap">
          <div class="lockup" id="outro-lockup">see<span class="cap">Group</span></div>
          <div class="tagline" id="outro-tagline">Снимаем контент, который работает</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0);
        tl.fromTo("#outro-checker", { opacity: 0 }, { opacity: 0.12, duration: 0.3, ease: "power2.out" }, 0.2);

        tl.fromTo(
          "#outro-lockup",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
          0.3,
        );
        tl.fromTo(
          "#outro-tagline",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          0.7,
        );

        // Held static to the final frame — no exit; this is the sign-off.
        window.__timelines["outro"] = tl;
      </script>
    </template>
  </body>
</html>
