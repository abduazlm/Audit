<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d3a2c;
      }
      body {
        font-family: "Montserrat", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6.0"
      data-width="1080"
      data-height="1920"
    >
      <!-- SEE Group — 6s personal-brand CTA sting. Same brandbook as
           videos/seegroup-promo (frame.md): #0D3A2C ground, gold accent,
           Montserrat, checker motif. -->
      <div
        id="el-hook"
        data-composition-id="hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="2.8"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-cta"
        data-composition-id="cta"
        data-composition-src="compositions/frames/02-cta.html"
        data-start="2.8"
        data-duration="3.2"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Root timeline stays thin — all animation lives in the sub-compositions.
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
