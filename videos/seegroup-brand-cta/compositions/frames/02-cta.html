<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #0d3a2c;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          opacity: 0;
        }
        .checker {
          position: absolute;
          bottom: 64px;
          left: 64px;
          width: 180px;
          height: 180px;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          grid-template-rows: repeat(3, 1fr);
          opacity: 0;
        }
        .checker div:nth-child(odd) {
          background: #a37e2d;
        }
        .checker div:nth-child(even) {
          background: #104434;
        }
        .center-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 28px;
          padding: 0 90px;
        }
        .kicker {
          font-size: 34px;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #f4f1e9;
          text-align: center;
          opacity: 0;
        }
        .word {
          font-size: 190px;
          font-weight: 800;
          line-height: 1;
          color: #c99a3a;
          text-align: center;
          transform-origin: 50% 50%;
        }
        .settle {
          font-size: 46px;
          font-weight: 700;
          line-height: 1.25;
          color: #f4f1e9;
          text-align: center;
          max-width: 820px;
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="cta"
        data-width="1080"
        data-height="1920"
        data-duration="3.2"
      >
        <div class="checker" id="cta-checker">
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
          <div></div><div></div><div></div>
        </div>
        <div class="center-wrap">
          <div class="kicker" id="cta-kicker">Напишите нам слово</div>
          <div class="word" id="cta-word">«БРЕНД»</div>
          <div class="settle" id="cta-settle">
            и мы проведём для вас<br />бесплатный мини-разбор
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0);
        tl.fromTo("#cta-checker", { opacity: 0 }, { opacity: 0.12, duration: 0.3, ease: "power2.out" }, 0.15);

        tl.fromTo(
          "#cta-kicker",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          0.15,
        );
        tl.fromTo(
          "#cta-word",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)" },
          0.45,
        );
        tl.fromTo(
          "#cta-settle",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          1.0,
        );

        // Held static to the final frame — no exit, this is the sign-off.
        window.__timelines["cta"] = tl;
      </script>
    </template>
  </body>
</html>
